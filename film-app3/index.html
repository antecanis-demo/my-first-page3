<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10131d">
<title>FILM FINDER — あなたにぴったりの映画</title>
<style>
:root{color-scheme:dark;--bg:#10131d;--panel:#191e2b;--panel2:#202738;--ink:#f5f2ec;--muted:#a9b0c0;--accent:#f2b84b;--line:#30394b;--pink:#e78c9c}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -10%,#34304a 0,transparent 38%),var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;line-height:1.6}button,input,select{font:inherit}button{cursor:pointer}.wrap{width:min(1080px,100% - 36px);margin:auto}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-bottom:1px solid var(--line)}.brand{font-weight:900;letter-spacing:.16em}.brand span{color:var(--accent)}.top small{color:var(--muted)}.hero{padding:42px 0 28px}.eyebrow{color:var(--accent);font-size:.78rem;font-weight:800;letter-spacing:.18em}.hero h1{font-size:clamp(2rem,6vw,3.7rem);line-height:1.2;margin:10px 0}.hero p{color:var(--muted);margin:12px 0 0}.layout{display:grid;grid-template-columns:310px minmax(0,1fr);gap:22px;align-items:start}.panel,.movie{background:var(--panel);border:1px solid var(--line);border-radius:18px}.panel{padding:20px;position:sticky;top:14px}.panel h2{font-size:1.05rem;margin:0 0 18px}.field{margin:18px 0}.field label{display:flex;justify-content:space-between;font-weight:700;font-size:.9rem;margin-bottom:8px}.hint{color:var(--muted);font-size:.78rem;font-weight:400}select{width:100%;padding:12px;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px}input[type=range]{width:100%;accent-color:var(--accent)}.checks{display:flex;flex-wrap:wrap;gap:8px}.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:7px 10px;color:var(--muted);font-size:.82rem}.chip:has(input:checked){border-color:var(--accent);color:var(--ink);background:#f2b84b18}.chip input{accent-color:var(--accent)}.primary,.subtle{border:0;border-radius:11px;padding:12px 16px;font-weight:800}.primary{background:var(--accent);color:#211b10;width:100%}.subtle{background:var(--panel2);color:var(--ink);border:1px solid var(--line)}.results-head{display:flex;justify-content:space-between;align-items:end;gap:12px;margin:2px 0 14px}.results-head h2{margin:0;font-size:1.25rem}.results-head p{margin:3px 0 0;color:var(--muted);font-size:.82rem}.count{color:var(--accent);font-weight:800}.movies{display:grid;gap:13px}.movie{display:grid;grid-template-columns:112px minmax(0,1fr);overflow:hidden}.poster{min-height:168px;display:grid;place-items:center;text-align:center;padding:10px;background:linear-gradient(145deg,var(--c1),var(--c2));font-size:2rem}.poster span{font-size:.75rem;display:block;font-weight:800;letter-spacing:.1em}.info{padding:15px 16px;min-width:0}.meta{display:flex;gap:7px;flex-wrap:wrap;color:var(--muted);font-size:.76rem}.tag{border:1px solid var(--line);padding:2px 7px;border-radius:999px}.info h3{margin:6px 0 4px;font-size:1.12rem}.info p{margin:5px 0;color:var(--muted);font-size:.86rem}.match{color:var(--accent);font-size:.8rem;font-weight:800}.why{font-size:.8rem!important;color:#e9d7b4!important}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.actions button{padding:7px 10px;font-size:.78rem}.empty{border:1px dashed var(--line);border-radius:16px;padding:35px 20px;text-align:center;color:var(--muted)}.foot{color:var(--muted);font-size:.75rem;padding:28px 0 38px}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#f2b84b;color:#211b10;padding:10px 16px;border-radius:99px;font-weight:800;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}.saved{color:var(--pink)!important}@media(max-width:760px){.wrap{width:min(100% - 24px,600px)}.top{padding:16px 0}.top small{font-size:.7rem}.hero{padding:30px 0 22px}.layout{grid-template-columns:1fr;gap:17px}.panel{position:static}.panel h2{margin-bottom:12px}.field{margin:14px 0}.movies{gap:10px}.movie{grid-template-columns:92px minmax(0,1fr)}.poster{min-height:160px}.info{padding:12px}.info h3{font-size:1rem}.results-head{align-items:center}}@media(max-width:360px){.movie{grid-template-columns:78px minmax(0,1fr)}.poster{font-size:1.5rem}.info p{font-size:.8rem}}
</style>
</head>
<body>
<header class="wrap top"><div class="brand">FILM<span>FINDER</span></div><small>あなたの「観たい」が見つかる。</small></header>
<main class="wrap">
<section class="hero"><div class="eyebrow">YOUR NEXT MOVIE NIGHT</div><h1>次に観る映画、<br>気分から選ぼう。</h1><p>ジャンルや気分、上映時間を選ぶだけ。あなたの好みに近い作品をスコア順におすすめします。</p></section>
<div class="layout">
<aside class="panel">
<h2>🎛️ 好みをカスタマイズ</h2>
<div class="field"><label for="mood">今の気分</label><select id="mood"><option value="any">なんでも楽しみたい</option><option value="laugh">笑ってスッキリ</option><option value="thrill">ハラハラしたい</option><option value="cry">心を揺さぶられたい</option><option value="think">じっくり考えたい</option><option value="heal">癒やされたい</option></select></div>
<div class="field"><label>好きなジャンル <span class="hint">複数選択OK</span></label><div class="checks" id="genres">
<label class="chip"><input type="checkbox" value="ドラマ" checked>ドラマ</label><label class="chip"><input type="checkbox" value="コメディ">コメディ</label><label class="chip"><input type="checkbox" value="アクション">アクション</label><label class="chip"><input type="checkbox" value="サスペンス">サスペンス</label><label class="chip"><input type="checkbox" value="アニメ">アニメ</label><label class="chip"><input type="checkbox" value="ドキュメンタリー">ドキュメンタリー</label><label class="chip"><input type="checkbox" value="恋愛">恋愛</label><label class="chip"><input type="checkbox" value="SF">SF</label></div></div>
<div class="field"><label for="runtime">観られる長さ <strong id="runtimeVal">150分まで</strong></label><input id="runtime" type="range" min="80" max="210" step="10" value="150"></div>
<div class="field"><label for="energy">刺激の強さ <strong id="energyVal">ふつう</strong></label><input id="energy" type="range" min="1" max="5" value="3"></div>
<div class="field"><label for="sort">並び順</label><select id="sort"><option value="match">おすすめ順</option><option value="rating">評価が高い順</option><option value="new">公開が新しい順</option><option value="short">短い順</option></select></div>
<button class="primary" id="recommend">この条件でおすすめを見る ✦</button>
<button class="subtle" id="reset" style="width:100%;margin-top:8px">条件をリセット</button>
</aside>
<section>
<div class="results-head"><div><h2>あなたへのおすすめ</h2><p id="summary">今の気分に合う作品をピックアップ</p></div><div class="count" id="count">8作品</div></div>
<div class="movies" id="movies" aria-live="polite"></div>
</section>
</div>
<footer class="foot">※ 作品データはアプリ内のサンプルです。最新の上映状況・公開日・評価をリアルタイム取得するものではありません。作品情報は手動で更新してください。<br>FILM FINDER · あなたの映画時間をもっと楽しく。</footer>
</main>
<div class="toast" id="toast"></div>
<script>
const films=[
{title:"国宝",year:2025,genre:["ドラマ"],mood:["cry","think"],runtime:175,rating:4.7,energy:2,desc:"芸の道に人生を懸けた人々を描く、圧倒的な熱量の人間ドラマ。",color:["#5c2635","#d28c67"],emoji:"🎭"},
{title:"8番出口",year:2025,genre:["サスペンス"],mood:["thrill","think"],runtime:95,rating:4.0,energy:4,desc:"無限に続く地下通路。異変を見逃さず、出口を目指す体験型スリラー。",color:["#263d4c","#8fa9ad"],emoji:"🚪"},
{title:"劇場版 チェンソーマン レゼ篇",year:2025,genre:["アニメ","アクション","恋愛"],mood:["thrill","cry"],runtime:100,rating:4.4,energy:5,desc:"予測不能な出会いと激しい戦いが交差するアクションアニメ。",color:["#722f28","#e5a45d"],emoji:"⚡"},
{title:"F1／エフワン",year:2025,genre:["ドラマ","アクション"],mood:["thrill","laugh"],runtime:155,rating:4.2,energy:4,desc:"サーキットを舞台に、再起を懸けた挑戦を描くスピード感あふれるドラマ。",color:["#202b47","#bd4e4a"],emoji:"🏎️"},
{title:"ウィキッド ふたりの魔女",year:2025,genre:["ドラマ","ファンタジー"],mood:["heal","cry"],runtime:160,rating:4.3,energy:2,desc:"正反対の二人の友情と選択を、壮大な音楽と魔法で描く物語。",color:["#24513f","#a4b58b"],emoji:"🪄"},
{title:"侍タイムスリッパー",year:2024,genre:["コメディ","ドラマ"],mood:["laugh","heal"],runtime:131,rating:4.5,energy:2,desc:"時代劇の撮影所に迷い込んだ侍の奮闘。笑いと温かさが広がる一作。",color:["#5c4631","#c7a46d"],emoji:"⚔️"},
{title:"ルックバック",year:2024,genre:["アニメ","ドラマ"],mood:["cry","think"],runtime:58,rating:4.6,energy:2,desc:"漫画を描く二人の少女の出会いと創作への情熱を描く短編アニメ。",color:["#344b55","#c18d69"],emoji:"✏️"},
{title:"PERFECT DAYS",year:2023,genre:["ドラマ"],mood:["heal","think"],runtime:124,rating:4.4,energy:1,desc:"日々の小さな喜びを丁寧にすくい上げる、静かな余韻の物語。",color:["#315047","#c1a77d"],emoji:"🌿"}
];
const $=id=>document.getElementById(id);let saved=new Set();
const moodNames={laugh:"笑ってスッキリ",thrill:"ハラハラ",cry:"心を揺さぶる",think:"じっくり考える",heal:"癒やし"};
function getPrefs(){return{mood:$("mood").value,genres:[...document.querySelectorAll('#genres input:checked')].map(x=>x.value),runtime:+$("runtime").value,energy:+$("energy").value,sort:$("sort").value}}
function score(f,p){let s=45;if(p.mood!=="any")s+=f.mood.includes(p.mood)?35:-8;if(p.genres.length)s+=f.genre.some(g=>p.genres.includes(g))?24:-12;if(f.runtime<=p.runtime)s+=8;else s-=Math.min(24,(f.runtime-p.runtime)*.5);s+=Math.max(0,12-Math.abs(f.energy-p.energy)*5);return Math.max(8,Math.min(99,Math.round(s)))}
function render(){const p=getPrefs();let data=films.map(f=>({...f,score:score(f,p)})).filter(f=>f.runtime<=p.runtime+35);if(p.sort==="rating")data.sort((a,b)=>b.rating-a.rating);else if(p.sort==="new")data.sort((a,b)=>b.year-a.year);else if(p.sort==="short")data.sort((a,b)=>a.runtime-b.runtime);else data.sort((a,b)=>b.score-a.score);
$("count").textContent=data.length+"作品";$("summary").textContent=(p.mood==="any"?"幅広い気分に":moodNames[p.mood]+"に")+"合いそうな作品を表示中";$("movies").innerHTML=data.map(f=>'<article class="movie"><div class="poster" style="--c1:'+f.color[0]+';--c2:'+f.color[1]+'">'+f.emoji+'<span>FILM PICK</span></div><div class="info"><div class="meta"><span class="tag">'+f.year+'年</span><span class="tag">'+f.runtime+'分</span><span class="tag">'+f.genre.join('・')+'</span><span>★ '+f.rating.toFixed(1)+'</span></div><h3>'+f.title+'</h3><div class="match">あなたとの相性 '+f.score+'%</div><p>'+f.desc+'</p><p class="why">'+(p.mood!=="any"&&f.mood.includes(p.mood)?"✓ 今の気分にぴったり": "✓ 気分を広げたいときにもおすすめ")+'</p><div class="actions"><button class="subtle '+(saved.has(f.title)?"saved":"")+'" data-save="'+f.title+'">'+(saved.has(f.title)?"♥ お気に入り済み":"♡ お気に入り")+'</button><button class="subtle" data-detail="'+f.title+'">ひとことメモ</button></div></div></article>').join("")||'<div class="empty">条件に合う作品が見つかりませんでした。上映時間を長くするか、ジャンルを広げてみてください。</div>'}
$("runtime").addEventListener("input",()=>{$("runtimeVal").textContent=$("runtime").value+"分まで"});
$("energy").addEventListener("input",()=>{$("energyVal").textContent=["","控えめ","やさしめ","ふつう","刺激的","かなり刺激的"][$("energy").value]});
$("recommend").addEventListener("click",render);
$("reset").addEventListener("click",()=>{$("mood").value="any";document.querySelectorAll('#genres input').forEach(x=>x.checked=false);$("runtime").value=150;$("runtimeVal").textContent="150分まで";$("energy").value=3;$("energyVal").textContent="ふつう";$("sort").value="match";render()});
$("movies").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;if(b.dataset.save){const t=b.dataset.save;saved.has(t)?saved.delete(t):saved.add(t);render();toast(saved.has(t)?"お気に入りに追加しました":"お気に入りから削除しました")}if(b.dataset.detail){const f=films.find(x=>x.title===b.dataset.detail);toast(f.title+"： "+f.runtime+"分・★"+f.rating.toFixed(1))}});
function toast(t){$("toast").textContent=t;$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1700)}
render();
</script>
</body>
</html>
